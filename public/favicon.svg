<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Circular container with soft glow shadow -->
  <circle cx="32" cy="32" r="30" fill="#F20B12" />
  <circle cx="32" cy="32" r="28" stroke="#FFD21C" stroke-width="1.5" stroke-dasharray="2 1" opacity="0.6"/>
  
  <!-- Steam plumes -->
  <path d="M26 15 C25 12, 27 10, 26 7" stroke="#FFF0DA" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M32 14 C31 11, 33 9, 32 6" stroke="#FFF0DA" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.95"/>
  <path d="M38 15 C37 12, 39 10, 38 7" stroke="#FFF0DA" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.85"/>
  
  <!-- Saffron biryani aroma & rice peak -->
  <ellipse cx="32" cy="20.5" rx="14" ry="4.5" fill="#FFD21C"/>
  <ellipse cx="32" cy="20.5" rx="12" ry="3.5" fill="#E6A110"/>
  <!-- Rice grains and spice highlights -->
  <circle cx="28" cy="20" r="1" fill="#FFF0DA"/>
  <circle cx="33" cy="19.5" r="1.2" fill="#720015"/>
  <circle cx="36" cy="20.5" r="0.9" fill="#15803D"/>
  
  <!-- Bucket Body (Tapered Bucket) -->
  <path d="M16 21 L20.5 49 C20.8 51 23 52.5 25.5 52.5 L38.5 52.5 C41 52.5 43.2 51 43.5 49 L48 21 Z" fill="#C90016" stroke="#720015" stroke-width="1"/>
  
  <!-- Golden rim of the bucket -->
  <path d="M15 21 C15 18.5, 49 18.5, 49 21 C49 23.5, 15 23.5, 15 21 Z" fill="#FFD21C" stroke="#B8860B" stroke-width="0.8"/>
  <ellipse cx="32" cy="21" rx="15.5" ry="2.2" fill="#FFE57F"/>
  
  <!-- Golden handle ear mounts -->
  <path d="M14.5 22 C13 23, 13 26, 14.5 27" stroke="#FFD21C" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M49.5 22 C51 23, 51 26, 49.5 27" stroke="#FFD21C" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  
  <!-- White Bucket Emblem Shield/Badge -->
  <rect x="22.5" y="27" width="19" height="15" rx="2.5" fill="#FFFFFF"/>
  <rect x="23.5" y="28" width="17" height="13" rx="1.5" stroke="#F20B12" stroke-width="0.8" fill="none"/>
  
  <!-- Letters RBB on the emblem -->
  <text x="32" y="37" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="7.5" fill="#C90016" text-anchor="middle" letter-spacing="0.5">RBB</text>
  <text x="32" y="40.2" font-family="'Arial', sans-serif" font-weight="bold" font-size="2.6" fill="#720015" text-anchor="middle" letter-spacing="0.4">BIRYANI</text>
  
  <!-- Bottom Bucket Rim Accent -->
  <ellipse cx="32" cy="51.5" rx="8.5" ry="1.5" fill="#720015" opacity="0.6"/>
</svg>
